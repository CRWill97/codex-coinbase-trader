[project]
name = "coinbase-trader-agent"
version = "0.1.0"
description = "Simulation-first AI trading agent for Coinbase Advanced Trade."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "coinbase-advanced-py>=1.8.2",
  "httpx>=0.28.1",
  "openai>=1.68.2",
  "pydantic>=2.11.1",
  "pydantic-settings>=2.8.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.5",
  "pytest-cov>=6.0.0",
]

[project.scripts]
coinbase-trader = "coinbase_trader.cli:main"

[build-system]
requires = ["setuptools>=75.8.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

